apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: harbor-runtime
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              env:
                - name: SSL_CERT_FILE
                  value: /certs/ca.crt
              volumeMounts:
                - name: ca
                  mountPath: /certs
                  readOnly: true
          volumes:
            - name: ca
              configMap:
                name: crossplane-root-ca
