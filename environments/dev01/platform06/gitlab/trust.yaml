# Establish trust between the flux controllers and the gitlap-bootstrap (job) and the gitlab service. And also expose the ca on the public endpoint so we can push to gitlab using a script
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: gitlab-root-ca
spec:
  sources:
    - secret:
        name: root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - gitlab
            - flux
            - kube-public
