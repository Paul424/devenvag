apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  sources:
    - secret:
        name: root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - gitlab
            - gitlab-runner
            - harbor
            - flux-system
