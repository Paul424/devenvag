apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
- namerefs.yaml

resources:
- ../../../base/gitlab
- secrets
- tls.yaml
- trust.yaml

configMapGenerator:
- behavior: create
  files:
  - values.yaml=values-gitlab.yaml
  name: values-gitlab

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: gitlab
  unsetOnly: true
