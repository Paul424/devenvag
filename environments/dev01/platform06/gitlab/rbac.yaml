apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-root-ca-reader
  namespace: kube-public
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [gitlab-root-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-root-ca-reader
  namespace: kube-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-root-ca-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
