global:
  hosts:
    domain: dev.local
    https: true
  edition: ce
  ingress:
    class: traefik
    provider: traefik
    configureCertmanager: false
    tls:
      secretName: gitlab-tls
  initialRootPassword:
    secret: gitlab-root-password
    key: PASSWORD
  certificates:
    customCAs:
      - secret: root-ca
  psql:
    host: gitlab-pg-rw.gitlab.svc.cluster.local
    port: 5432
    database: gitlab
    username: gitlab
    password:
      useSecret: true
      secret: gitlab-pg-app
      key: password

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-objectstore-connection
        key: connection
    artifacts:
      enabled: true
      bucket: gitlab-artifacts
    lfs:
      enabled: true
      bucket: gitlab-lfs
    uploads:
      enabled: true
      bucket: gitlab-uploads
    packages:
      enabled: true
      bucket: gitlab-packages
  # redis:
  # minio:
  #   enabled: true

installCertmanager: false
nginx-ingress:
  enabled: false
# postgresql:
#   install: true
redis:
  install: false
registry:
  enabled: false
gitlab-runner: 
  install: false
prometheus:
  install: false




