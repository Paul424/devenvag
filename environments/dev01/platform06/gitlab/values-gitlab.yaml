global:
  image:
    registry: host.minikube.internal:5000/gitlab-org/
  hosts:
    domain: dev.local
    https: true
  edition: ce
  
  ingress:
    enabled: true
    class: traefik
    provider: traefik
    configureCertmanager: false
    tls:
      secretName: gitlab-tls

  initialRootPassword:
    secret: gitlab-root-password
    key: PASSWORD
  certificates:
    customCAs:
      - configMap: root-ca
        keys:
          - ca.crt
  psql:
    host: gitlab-pg-rw.gitlab.svc.cluster.local
    port: 5432
    database: gitlab
    username: gitlab
    password:
      useSecret: true
      secret: gitlab-pg-app
      key: password

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-objectstore-connection
        key: connection
    artifacts:
      enabled: true
      bucket: gitlab-artifacts
    lfs:
      enabled: true
      bucket: gitlab-lfs
    uploads:
      enabled: true
      bucket: gitlab-uploads
    packages:
      enabled: true
      bucket: gitlab-packages

  redis:
    host: gitlab-redis.gitlab.svc.cluster.local
    port: 6379
    password:
      useSecret: true
      secret: gitlab-redis-password
      key: password

  gatewayApi:
    installEnvoy: false

  certificates:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/certificates
  kubectl:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/kubectl
  gitlabBase:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-base

upgradeCheck:
  enabled: false

installCertmanager: false
certmanager:
  installCRDs: false
  config:
    enableGatewayAPI: false

prometheus:
  install: false
  rbac:
    create: false

registry:
  enabled: false

gitlab-runner: 
  install: false

gitlab:
  gitlab-exporter:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-exporter

  gitlab-shell:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-shell

  kas:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-kas

  sidekiq:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-sidekiq-ce

  toolbox:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ce

  webservice:
    workhorse:
      image: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-workhorse-ce

  gitaly:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitaly

  migrations:
    image:
      repository: host.minikube.internal:5000/registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ce
