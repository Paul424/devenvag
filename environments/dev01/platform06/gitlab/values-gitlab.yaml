global:
  hosts:
    domain: dev.local
    https: true
  edition: ce
  ingress:
    class: traefik
    provider: traefik
    configureCertmanager: false
    tls:
      secretName: gitlab-tls
  initialRootPassword:
    secret: gitlab-root-password
    key: PASSWORD
  certificates:
    customCAs:
      - configMap: root-ca
        keys:
          - ca.crt
  psql:
    host: gitlab-pg-rw.gitlab.svc.cluster.local
    port: 5432
    database: gitlab
    username: gitlab
    password:
      useSecret: true
      secret: gitlab-pg-app
      key: password

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-objectstore-connection
        key: connection
    artifacts:
      enabled: true
      bucket: gitlab-artifacts
    lfs:
      enabled: true
      bucket: gitlab-lfs
    uploads:
      enabled: true
      bucket: gitlab-uploads
    packages:
      enabled: true
      bucket: gitlab-packages

  redis:
    host: gitlab-redis.gitlab.svc.cluster.local
    port: 6379
    password:
      useSecret: true
      secret: gitlab-redis-password
      key: password

upgradeCheck:
  enabled: false

installCertmanager: false
certmanager:
  installCRDs: false
  config:
    enableGatewayAPI: false

prometheus:
  install: false
  rbac:
    create: false

registry:
  enabled: false

gitlab-runner: 
  install: false
