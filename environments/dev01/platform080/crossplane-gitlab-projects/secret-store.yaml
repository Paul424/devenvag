---
# Allow ESO to read secrets from crossplane namespace (the access-tokens)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: crossplane-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: crossplane
      auth:
        serviceAccount:
          name: eso-crossplane-reader
          namespace: external-secrets
      # server.url en caProvider: zie de ESO-docs voor de in-cluster variant
