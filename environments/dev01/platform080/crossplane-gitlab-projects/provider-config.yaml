apiVersion: gitlab.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: gitlab
spec:
  baseURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/
  credentials:
    source: Secret
    method: PersonalAccessToken
    secretRef:
      namespace: crossplane
      name: gitlab-credentials
      key: token
