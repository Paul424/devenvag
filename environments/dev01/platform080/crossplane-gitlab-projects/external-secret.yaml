---
# Sync the gitlab access-token to env namespace for flux to use
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-fluxr-auth
  namespace: env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: crossplane-secrets
  target:
    name: gitlab-fluxr-auth
    template:
      data:
        username: fluxr
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: gitlab-flux-token
        property: token
