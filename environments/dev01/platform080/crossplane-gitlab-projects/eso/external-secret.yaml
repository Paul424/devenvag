---
# Sync the gitlab fluxr access-token to env namespace so flux can use it
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-fluxr-auth
  namespace: env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: crossplane-flux
  target:
    name: gitlab-fluxr-auth
    template:
      data:
        username: fluxr
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: gitlab-flux-token
        property: token
---
# Sync the gitlab runner access-token to gitlab-runner namespace
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-auth
  namespace: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: crossplane-runner
  target:
    name: gitlab-runner-auth
    template:
      data:
        username: runner
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: gitlab-runner-token
        property: token
