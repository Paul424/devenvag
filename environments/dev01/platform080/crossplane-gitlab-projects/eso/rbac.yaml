apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-gitlab-flux-token
  namespace: crossplane
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - gitlab-flux-token
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-gitlab-flux-token
  namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-gitlab-flux-token
subjects:
  - kind: ServiceAccount
    name: eso-gitlab-flux
    namespace: env
    