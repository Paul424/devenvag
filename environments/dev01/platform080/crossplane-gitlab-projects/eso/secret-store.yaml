---
# Allow ESO to read secrets from crossplane namespace (the access-tokens)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: crossplane-flux
  namespace: env
spec:
  provider:
    kubernetes:
      remoteNamespace: crossplane
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-gitlab-flux



