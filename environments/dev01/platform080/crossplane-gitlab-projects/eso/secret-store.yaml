---
# Allow ESO to read secrets from crossplane namespace for the flux access-token
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: crossplane-flux
  namespace: env
spec:
  provider:
    kubernetes:
      remoteNamespace: crossplane
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-gitlab-flux
---
# Allow ESO to read secrets from crossplane namespace for the runner access-token
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: crossplane-runner
  namespace: gitlab-runner
spec:
  provider:
    kubernetes:
      remoteNamespace: crossplane
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-gitlab-runner