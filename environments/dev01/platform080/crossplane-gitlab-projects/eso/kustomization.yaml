apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - sa.yaml
  - rbac.yaml
  - secret-store.yaml
  - external-secret.yaml

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-relevant-here
      namespace: crossplane
    unsetOnly: true
