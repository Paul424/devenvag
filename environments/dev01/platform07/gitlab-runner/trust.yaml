apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: gitlab-runner-ca
spec:
  sources:
    - secret:
        name: root-ca
        key: tls.crt
  target:
    secret:
      key: gitlab.dev.local.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gitlab-runners
        