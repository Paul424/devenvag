apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-runner-bootstrap
  namespace: gitlab-runner
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: gitlab-runner-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: docker.io/alpine/k8s:1.34.1
          command:
            - /bin/sh
            - -c
          args:
            - |-
              set -euxo
              G=http://gitlab-webservice-default.gitlab.svc.cluster.local:8181
              RUNNER_TOKEN_SECRET=gitlab-runner-token
              RUNNER=kuberunner

              if kubectl -n gitlab-runner get secret "$RUNNER_TOKEN_SECRET" >/dev/null 2>&1; then
                echo "Secret $RUNNER_TOKEN_SECRET already exists; skipping runner creation"
                exit 0
              fi

              kubectl -n gitlab wait --for=condition=available deploy/gitlab-toolbox --timeout=3m

              # 1. token
              BOOT="glpat-$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 26)"
              kubectl -n gitlab exec deploy/gitlab-toolbox -c toolbox -- gitlab-rails runner "
                u = User.find_by_username('root')
                u.personal_access_tokens.where(name: 'bootstrap').destroy_all
                t = u.personal_access_tokens.build(name: 'bootstrap', scopes: [:api], expires_at: 1.day.from_now.to_date)
                t.set_token('$BOOT')
                t.save!
              "

              api() {
                curl --fail --silent --show-error \
                  -H "PRIVATE-TOKEN: $BOOT" \
                  -H 'Content-Type: application/json' "$@"
              }

              RUNNER_RESPONSE=$(api -X POST "$G/api/v4/user/runners" \
                -d "$(jq -nc --arg description "$RUNNER" \
                  '{runner_type:"instance_type",description:$description,tag_list:["kubernetes"],run_untagged:true}')")
              RUNNER_TOKEN=$(printf '%s' "$RUNNER_RESPONSE" | jq -r '.token // empty')
              if [ -z "$RUNNER_TOKEN" ]; then
                echo "GitLab did not return a runner authentication token" >&2
                exit 1
              fi

              kubectl -n gitlab-runner create secret generic "$RUNNER_TOKEN_SECRET" \
                --from-literal=runner-token="$RUNNER_TOKEN" \
                --from-literal=runner-registration-token= \
                --dry-run=client -o yaml | kubectl apply -f -

              api -X DELETE "$G/api/v4/personal_access_tokens/self" -o /dev/null
              echo "Created instance runner $RUNNER and secret $RUNNER_TOKEN_SECRET"
