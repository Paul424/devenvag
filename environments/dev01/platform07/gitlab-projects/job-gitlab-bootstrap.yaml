apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-bootstrap
  namespace: gitlab
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: gitlab-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: ca
          configMap:
            name: gitlab-root-ca
      containers:
        - name: bootstrap
          image: docker.io/alpine/k8s:1.34.1
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
          env:
            - name: FLUXR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-flux-user-secret
                  key: PASSWORD
            - name: PUSHR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-pushr-user-secret
                  key: PASSWORD
          command:
            - /bin/sh
            - -c
          args:
            - "set -euxo\nG=http://gitlab-webservice-default.gitlab.svc.cluster.local:8181\nGROUP=platform\nREPO=devenvag\nFLUXRUSER=fluxr\nFLUXRSECRET=gitlab-fluxr-auth\nPUSHRUSER=pushr\nPUSHRSECRET=gitlab-pushr-auth\n    #magic___^_^___line\nif kubectl -n env get secret \"$PUSHRSECRET\" >/dev/null 2>&1; then\n  echo \"secret $PUSHRSECRET exists, skip\"; exit 0\nfi\n    #magic___^_^___line\nkubectl -n gitlab wait --for=condition=available deploy/gitlab-toolbox --timeout=3m\n    #magic___^_^___line\n# 1. token\nBOOT=\"glpat-$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 26)\"\nkubectl -n gitlab exec deploy/gitlab-toolbox -c toolbox -- gitlab-rails runner \"\n  u = User.find_by_username('root')\n  u.personal_access_tokens.where(name: 'bootstrap').destroy_all\n  t = u.personal_access_tokens.build(name: 'bootstrap', scopes: [:api], expires_at: 1.day.from_now.to_date)\n  t.set_token('$BOOT')\n  t.save!\n\"\n    #magic___^_^___line\napi() { curl -sS -H \"PRIVATE-TOKEN: $BOOT\" -H 'Content-Type: application/json' \"$@\"; }\nstatus() { api -o /dev/null -w '%{http_code}' \"$@\"; }\n    #magic___^_^___line\n# 2. group\nif [ \"$(status \"$G/api/v4/groups/$GROUP\")\" != 200 ]; then\n  api -X POST \"$G/api/v4/groups\" -d \"{\\\"name\\\":\\\"$GROUP\\\",\\\"path\\\":\\\"$GROUP\\\"}\" >/dev/null\nfi\nGID=$(api \"$G/api/v4/groups/$GROUP\" | jq -r .id)\n    #magic___^_^___line\n# 3. repo\nif [ \"$(status \"$G/api/v4/projects/$GROUP%2F$REPO\")\" != 200 ]; then\n  api -X POST \"$G/api/v4/projects\" \\\n    -d \"{\\\"name\\\":\\\"$REPO\\\",\\\"path\\\":\\\"$REPO\\\",\\\"namespace_id\\\":$GID,\\\"visibility\\\":\\\"private\\\",\\\"initialize_with_readme\\\":false}\" >/dev/null\nfi\napi -X DELETE \"$G/api/v4/projects/$GROUP%2F$REPO/protected_branches/main\" -o /dev/null || true\napi -X POST \"$G/api/v4/projects/$GROUP%2F$REPO/protected_branches\" \\\n  -d '{\"name\":\"main\",\"push_access_level\":30,\"merge_access_level\":30}'              \n    #magic___^_^___line\n# 4. local user fluxr\nUID_=$(api \"$G/api/v4/users?username=$FLUXRUSER\" | jq -r '.[0].id // empty')\nif [ -z \"$UID_\" ]; then\n  UID_=$(api -X POST \"$G/api/v4/users\" -d \"$(jq -nc --arg p \"$FLUXR_PASSWORD\" \\\n    '{name:\"Flux\",username:\"fluxr\",email:\"fluxr@dev.local\",password:$p,skip_confirmation:true,can_create_group:false}')\" | jq -r .id)\nfi\n[ -n \"$UID_\" ] && [ \"$UID_\" != null ] || { echo \"Failed to create user\"; exit 1; }\n    #magic___^_^___line\n# 5. rechten: 20 = Reporter (read-only), 30 = Developer (nodig voor pushen)\napi -X POST \"$G/api/v4/groups/$GID/members\" -d \"{\\\"user_id\\\":$UID_,\\\"access_level\\\":20}\" >/dev/null || true\n    #magic___^_^___line\n# 6. PAT aanmaken (maximaal 365 dagen geldig)\nEXP=$(date -u -d \"@$(( $(date +%s) + 364*86400 ))\" +%F)\nTOKEN=$(api -X POST \"$G/api/v4/users/$UID_/personal_access_tokens\" \\\n  -d \"{\\\"name\\\":\\\"fluxr\\\",\\\"scopes\\\":[\\\"read_repository\\\"],\\\"expires_at\\\":\\\"$EXP\\\"}\" | jq -r .token)\n[ -n \"$TOKEN\" ] && [ \"$TOKEN\" != null ] || { echo \"Failed to create PAT\"; exit 1; }\n    #magic___^_^___line\n# 7. secret voor Flux (basic auth + CA)\nkubectl -n env create secret generic \"$FLUXRSECRET\" \\\n  --from-literal=username=\"$FLUXRUSER\" --from-literal=password=\"$TOKEN\" \\\n  --from-file=ca.crt=/ca/ca.crt \\\n  --dry-run=client -o yaml | kubectl apply -f -\n    #magic___^_^___line\n# 8. local user pushr\nUID_=$(api \"$G/api/v4/users?username=$PUSHRUSER\" | jq -r '.[0].id // empty')\nif [ -z \"$UID_\" ]; then\n  UID_=$(api -X POST \"$G/api/v4/users\" -d \"$(jq -nc --arg p \"$PUSHR_PASSWORD\" \\\n    '{name:\"Push\",username:\"pushr\",email:\"pushr@dev.local\",password:$p,skip_confirmation:true,can_create_group:false}')\" | jq -r .id)\nfi\n[ -n \"$UID_\" ] && [ \"$UID_\" != null ] || { echo \"Failed to create user\"; exit 1; }\n    #magic___^_^___line\n# 9. rechten: 30 = Developer (nodig voor pushen)\napi -X POST \"$G/api/v4/groups/$GID/members\" -d \"{\\\"user_id\\\":$UID_,\\\"access_level\\\":30}\" >/dev/null || true\n    #magic___^_^___line\n# 10. PAT aanmaken (maximaal 365 dagen geldig)\nEXP=$(date -u -d \"@$(( $(date +%s) + 364*86400 ))\" +%F)\nTOKEN=$(api -X POST \"$G/api/v4/users/$UID_/personal_access_tokens\" \\\n  -d \"{\\\"name\\\":\\\"pushr\\\",\\\"scopes\\\":[\\\"read_repository\\\",\\\"write_repository\\\"],\\\"expires_at\\\":\\\"$EXP\\\"}\" | jq -r .token)\n[ -n \"$TOKEN\" ] && [ \"$TOKEN\" != null ] || { echo \"Failed to create PAT\"; exit 1; }\n    #magic___^_^___line\n# 11. secret voor Flux (basic auth + CA)\nkubectl -n env create secret generic \"$PUSHRSECRET\" \\\n  --from-literal=username=\"$PUSHRUSER\" --from-literal=password=\"$TOKEN\" \\\n  --from-file=ca.crt=/ca/ca.crt \\\n  --dry-run=client -o yaml | kubectl apply -f -\n    #magic___^_^___line\n# 12. bootstrap-token intrekken\napi -X DELETE \"$G/api/v4/personal_access_tokens/self\" -o /dev/null\n    #magic___^_^___line\n# 13. summary\necho \"ready: $GROUP/$REPO, users $FLUXRUSER $PUSHRUSER, expiry $EXP\""
