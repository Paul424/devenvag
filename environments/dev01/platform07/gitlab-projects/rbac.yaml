apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-bootstrap
  namespace: gitlab
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-bootstrap
  namespace: gitlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-bootstrap
subjects:
  - kind: ServiceAccount
    name: gitlab-bootstrap
    namespace: gitlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-bootstrap-secrets
  namespace: env
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-bootstrap-secrets
  namespace: env
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-bootstrap-secrets
subjects:
  - kind: ServiceAccount
    name: gitlab-bootstrap
    namespace: gitlab
