apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-pat
  namespace: gitlab
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled     # recreate in case of immutable changes
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: gitlab-pat
      restartPolicy: OnFailure
      volumes:
        - name: script
          configMap:
            name: gitlab-pat-script
      containers:
        - name: bootstrap
          image: docker.io/alpine/k8s:1.34.1
          command: ["/bin/sh", "/scripts/create-pat.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
