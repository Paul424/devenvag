apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets
  - job-gitlab-pat.yaml
  - sa.yaml
  - rbac.yaml

images:
  - name: docker.io/alpine/k8s
    newName: host.minikube.internal:5000/docker.io/alpine/k8s

configMapGenerator:
  - name: gitlab-pat-script
    files:
      - create-pat.sh
    literals:
      - run=1

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-relevant-here
      namespace: gitlab
    unsetOnly: true
