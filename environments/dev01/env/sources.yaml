# The (upstream) source only for initial development for the bootstrapping
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: devenvag-bootstrap
  namespace: env
spec:
  interval: 1m
  url: https://github.com/Paul424/devenvag.git
  ref:
    branch: main
  secretRef:
    name: private-git
---
# The zot backed OCI repo for the initial manifests for the bootstrapping; this is used before harbor is up and running
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: devenvag-bootstrap
  namespace: env
spec:
  interval: 5m
  url: oci://host.minikube.internal:5000/platform/cluster
  ref:
    tag: v1
  certSecretRef:
    name: root-ca
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: devenvag
  namespace: env
spec:
  interval: 1m
  url: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/platform/devenvag.git
  ref:
    branch: main
  secretRef:
    name: gitlab-fluxr-auth
