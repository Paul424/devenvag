apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zot-charts
  namespace: env
spec:
  type: oci
  interval: 10m
  url: oci://host.minikube.internal:5000/charts
  certSecretRef:
    name: root-ca
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: charts
  namespace: env
spec:
  type: oci
  interval: 10m
  url: oci://harbor-core.harbor.svc.cluster.local/charts
  insecure: true
  secretRef:
    name: harbor-robot-puller-secret
