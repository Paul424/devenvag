  # sourceRef:
  #   kind: OCIRepository
  #   name: devenvag
  path: ./environments/dev01/platform02/
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
    - name: platform01
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: harbor
      namespace: harbor
