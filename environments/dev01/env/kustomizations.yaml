apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform010
  namespace: env
spec:
  interval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: devenvag-bootstrap
  # sourceRef:
  #   kind: OCIRepository
  #   name: devenvag
  path: ./environments/dev01/platform010/
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-cainjector
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: trust-manager
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform020
  namespace: env
spec:
  interval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: devenvag-bootstrap
  # sourceRef:
  #   kind: OCIRepository
  #   name: devenvag
  path: ./environments/dev01/platform020/
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
    - name: platform010
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: harbor
      namespace: harbor
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform030
  namespace: env
spec:
  interval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: devenvag-bootstrap
  # sourceRef:
  #   kind: OCIRepository
  #   name: devenvag
  path: ./environments/dev01/platform030/
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
    - name: platform020
  # healthChecks:
  #   - apiVersion: batch/v1
  #     kind: Job
  #     name: harbor-bootstrap
  #     namespace: harbor
  healthCheckExprs:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      current: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
      failed: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'False')
---
