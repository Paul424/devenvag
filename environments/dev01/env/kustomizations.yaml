---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform01
  namespace: env
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: devenvag
  # sourceRef:
  #   kind: OCIRepository
  #   name: devenvag
  path: ./environments/dev01/platform01/
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-cainjector
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform02
  namespace: env
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: devenvag
  # sourceRef:
  #   kind: OCIRepository
  #   name: devenvag
  path: ./environments/dev01/platform02/
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
    - name: platform01
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform09
  namespace: env
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: devenvag
  # sourceRef:
  #   kind: OCIRepository
  #   name: devenvag
  path: ./environments/dev01/platform09/
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
    - name: platform02
