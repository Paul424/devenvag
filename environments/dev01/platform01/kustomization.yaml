apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/cert-manager
- traefik
- metallb.yaml
- storageclass.yaml

images:
  - name: quay.io/jetstack/cert-manager-cainjector
    newName: host.minikube.internal:5000/quay.io/jetstack/cert-manager-cainjector
  - name: quay.io/jetstack/cert-manager-controller
    newName: host.minikube.internal:5000/quay.io/jetstack/cert-manager-controller
  - name: quay.io/jetstack/cert-manager-webhook
    newName: host.minikube.internal:5000/quay.io/jetstack/cert-manager-webhook
  - name: quay.io/jetstack/trust-pkg-debian-trixie
    newName: host.minikube.internal:5000/quay.io/jetstack/trust-pkg-debian-trixie
  - name: quay.io/jetstack/trust-manager
    newName: host.minikube.internal:5000/quay.io/jetstack/trust-manager
