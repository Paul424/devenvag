global:
  imageRegistry: "host.minikube.internal:5000/docker.io"

  seaweedfs:
    enableReplication: false
    replicationPlacement: "001"

master:
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 1Gi

volume:
  replicas: 1
  dataDirs:
    - name: data
      type: persistentVolumeClaim
      size: 50Gi
      maxVolumes: 0

filer:
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 10Gi

s3:
  enabled: true
  replicas: 1
  createBuckets:
    - name: gitlab-artifacts
    - name: gitlab-lfs
    - name: gitlab-uploads
    - name: gitlab-packages

admin:
  ingress:
    enabled: true
    className: traefik
    host: "admin.seaweedfs.dev.local"
    tls:
      - hosts:
          - admin.seaweedfs.dev.local
        secretName: seaweedfs-tls
