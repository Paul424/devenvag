apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
- namerefs.yaml

resources:
- ../../../base/seaweedfs
- secrets
- tls.yaml

configMapGenerator:
- behavior: create
  files:
  - values.yaml=values-seaweedfs.yaml
  name: values-seaweedfs

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: seaweedfs
  unsetOnly: true
