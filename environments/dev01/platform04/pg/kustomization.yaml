apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
- namerefs.yaml

resources:
- ../../../base/pg
- secrets

configMapGenerator:
- behavior: create
  files:
  - values.yaml=values-cnpg.yaml
  name: values-cnpg

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: cnpg-system
  unsetOnly: true
