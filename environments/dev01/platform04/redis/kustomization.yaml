apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- redis.yaml
- secrets

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: gitlab
  unsetOnly: true

images:
  - name: docker.io/library/redis
    newName: host.minikube.internal:5000/docker.io/library/redis
