apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - namerefs.yaml

resources:
  - ../../base/gitops/flux

images:
  - name: ghcr.io/fluxcd/helm-controller
    newName: host.minikube.internal:5000/ghcr.io/fluxcd/helm-controller
  - name: ghcr.io/fluxcd/kustomize-controller
    newName: host.minikube.internal:5000/ghcr.io/fluxcd/kustomize-controller
  - name: ghcr.io/fluxcd/notification-controller
    newName: host.minikube.internal:5000/ghcr.io/fluxcd/notification-controller
  - name: ghcr.io/fluxcd/source-controller
    newName: host.minikube.internal:5000/ghcr.io/fluxcd/source-controller

patches:
  - target:
      kind: Deployment
      name: source-controller
    patch: |
      # Enabled the source-controller to reach the zot registry running on the (local) host.
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - hostnames: ["host.minikube.internal"]
            ip: "192.168.49.1"
