apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-bootstrap-secrets
  namespace: gitlab-runner
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-bootstrap-secrets
  namespace: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-bootstrap-secrets
subjects:
  - kind: ServiceAccount
    name: harbor-bootstrap
    namespace: harbor
