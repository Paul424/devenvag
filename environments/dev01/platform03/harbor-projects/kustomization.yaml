apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- secrets
- job-harbor-bootstrap.yaml
- netshoot.yaml
- sa.yaml
- rbac.yaml

images:
  # - name: nicolaka/netshoot
  #   newName: host.minikube.internal:5000/docker.io/nicolaka/netshoot
  - name: docker.io/alpine/k8s
    newName: host.minikube.internal:5000/docker.io/alpine/k8s

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: harbor
  unsetOnly: true
