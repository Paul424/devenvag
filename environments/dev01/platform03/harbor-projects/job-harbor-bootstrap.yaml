apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-bootstrap
  namespace: harbor
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: nicolaka/netshoot:v0.16
          env:
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-admin-password
                  key: HARBOR_ADMIN_PASSWORD
            - name: ROBOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-secret
                  key: SECRET
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euxo pipefail
              HARBOR_URL=http://harbor-core.harbor.svc.cluster.local
              api() { curl -s -o /dev/null -w '%{http_code}' -u "admin:$PASS" \
                -H 'Content-Type: application/json' -X POST "$HARBOR_URL$1" -d "$2"; }
              ok() { case "$1" in 201|409) echo "$2: ok ($1)";; *) echo "$2: failed ($1)"; exit 1;; esac; }

              for p in registry.k8s.io gcr.io quay.io ghcr.io docker.io; do
                ok "$(api /api/v2.0/projects "{\"project_name\":\"$p\",\"public\":false}")" "project $p"
              done

              ok "$(api /api/v2.0/robots "{
                \"name\":\"pusher\",
                \"level\":\"system\",
                \"duration\":-1,
                \"secret\":\"$ROBOT_SECRET\",
                \"permissions\":[{\"kind\":\"project\",\"namespace\":\"*\",
                  \"access\":[{\"resource\":\"repository\",\"action\":\"push\"},
                              {\"resource\":\"repository\",\"action\":\"pull\"}]}]}")" "robot pusher"