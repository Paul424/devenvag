apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - namerefs.yaml

resources:
  - ../../../base/external-secrets
  - secrets

configMapGenerator:
  - behavior: create
    files:
      - values.yaml=values-external-secrets.yaml
    name: values-external-secrets

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-relevant-here
      namespace: external-secrets
    unsetOnly: true
