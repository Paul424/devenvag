apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - namerefs.yaml

resources:
  - ../../../base/crossplane
  - secrets

configMapGenerator:
  - behavior: create
    files:
      - values.yaml=values-crossplane.yaml
    name: values-crossplane

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-relevant-here
      namespace: crossplane
    unsetOnly: true
