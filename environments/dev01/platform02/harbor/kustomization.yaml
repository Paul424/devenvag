apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - namerefs.yaml

resources:
  - ../../../base/harbor
  - secrets
  - tls.yaml

configMapGenerator:
  - behavior: create
    files:
      - values.yaml=values-harbor.yaml
    name: values-harbor

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: not-relevant-here
      namespace: harbor
    unsetOnly: true
