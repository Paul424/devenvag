---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor
spec:
  secretName: harbor-tls
  duration: 2160h # 90d
  renewBefore: 720h # 30d
  dnsNames:
  - harbor.dev.local
  issuerRef:
    kind: Issuer
    name: harbor-selfsigned-issuer
