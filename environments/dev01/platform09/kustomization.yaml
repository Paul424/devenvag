apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Switch over the Kustomizations from zot OCI to Gitlab / Harbor
resources:
  - ../env/

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: platform01
    patch: |-
      - op: replace
        path: /spec/sourceRef
        value:
          kind: GitRepository
          name: devenvag
