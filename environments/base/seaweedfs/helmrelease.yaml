apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
spec:
  targetNamespace: seaweedfs
  releaseName: seaweedfs
  interval: 3m
  chart:
    spec:
      chart: seaweedfs
      version: 4.53.0
      sourceRef:
        kind: HelmRepository
        name: zot-charts
        namespace: env
  test:
    enable: false
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: -1
  upgrade:
    timeout: 10m
    remediation:
      retries: 5
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 10m
    cleanupOnFail: false
  valuesFrom:
    - kind: Secret
      name: common-seaweedfs-secret
    - kind: ConfigMap
      name: common-seaweedfs
    - kind: Secret
      name: values-seaweedfs-secret
    - kind: ConfigMap
      name: values-seaweedfs
