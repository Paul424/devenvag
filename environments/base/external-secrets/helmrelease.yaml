apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  targetNamespace: external-secrets
  releaseName: external-secrets
  interval: 3m
  chart:
    spec:
      chart: external-secrets
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: zot-charts
        namespace: env
  test:
    enable: false
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 10m
    cleanupOnFail: false
  valuesFrom:
    - kind: Secret
      name: common-external-secrets-secret
    - kind: ConfigMap
      name: common-external-secrets
    - kind: Secret
      name: values-external-secrets-secret
    - kind: ConfigMap
      name: values-external-secrets
