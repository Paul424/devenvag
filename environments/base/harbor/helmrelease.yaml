apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  targetNamespace: harbor
  releaseName: harbor
  interval: 3m
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: zot-charts
        namespace: env
  test:
    enable: false
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: -1
  upgrade:
    timeout: 10m
    remediation:
      retries: 5
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 10m
    cleanupOnFail: false
  valuesFrom:
    - kind: Secret
      name: common-harbor-secret
    - kind: ConfigMap
      name: common-harbor
    - kind: Secret
      name: values-harbor-secret
    - kind: ConfigMap
      name: values-harbor
