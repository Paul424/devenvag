apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
spec:
  targetNamespace: crossplane
  releaseName: crossplane
  interval: 3m
  chart:
    spec:
      chart: crossplane
      version: 2.4.3
      sourceRef:
        kind: HelmRepository
        name: zot-charts
        namespace: env
  test:
    enable: false
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: -1
  upgrade:
    timeout: 10m
    remediation:
      retries: 5
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 10m
    cleanupOnFail: false
  valuesFrom:
    - kind: Secret
      name: common-crossplane-secret
    - kind: ConfigMap
      name: common-crossplane
    - kind: Secret
      name: values-crossplane-secret
    - kind: ConfigMap
      name: values-crossplane
