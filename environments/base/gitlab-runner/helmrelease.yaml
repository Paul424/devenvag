apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
spec:
  targetNamespace: gitlab
  releaseName: gitlab-runner
  interval: 5m
  chart:
    spec:
      chart: gitlab
      version: 10.5.4
      sourceRef:
        kind: HelmRepository
        name: zot-charts
        namespace: env
  test:
    enable: false
  install:
    createNamespace: false
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 10m
    cleanupOnFail: false
  valuesFrom:
    - kind: Secret
      name: common-gitlab-secret
    - kind: ConfigMap
      name: common-gitlab
    - kind: Secret
      name: values-gitlab-secret
    - kind: ConfigMap
      name: values-gitlab
