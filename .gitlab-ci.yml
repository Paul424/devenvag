stages:
  - lint
  - release

yamlfmt:
  stage: lint
  image:
    name: harbor.dev.local/ghcr.io/google/yamlfmt:0.21.0
    entrypoint: [""]
  rules:
    - changes: ["**/*.yaml", "**/*.yml", ".yamlfmt"]
  script:
    - yamlfmt -lint 'environments/**/*.yaml' 'environments/**/*.yml'

changelog:
  stage: release
  image:
    name: harbor.dev.local/docker.io/orhunp/git-cliff:2.14.2
    entrypoint: [""]
  before_script:
    - export GITLAB_TOKEN="$(cat /secrets/gitlab-runner-auth/password)"
    - export GL_TOKEN="$GITLAB_TOKEN"
  variables:
    GITLAB_API_URL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/api/v4
    GITLAB_REPO: $CI_PROJECT_PATH  
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - NEXT=$(git-cliff --use-native-tls -c gitlab -r . --bumped-version)
    - echo "NEXT_VERSION=$NEXT" > build.env
    - git-cliff --use-native-tls -c gitlab -r . --bump > CHANGELOG.md
    - git-cliff --use-native-tls -c gitlab -r . --unreleased --bump --strip header > RELEASE_NOTES.md
  artifacts:
    paths:
      - CHANGELOG.md
      - RELEASE_NOTES.md
    reports:
      dotenv: build.env

release:
  stage: release
  image:
    name: harbor.dev.local/registry.gitlab.com/gitlab-org/cli:v1.131.0
  needs:
    - job: changelog
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  variables:
    # GITLAB_API_URL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/api/v4
    # GITLAB_REPO: $CI_PROJECT_PATH  
    ADDITIONAL_CA_CERT_BUNDLE: $CI_SERVER_TLS_CA_FILE
  script:
    - 'echo "CI_SERVER_TLS_CA_FILE: ${CI_SERVER_TLS_CA_FILE:-leeg}"'
    - 'echo "ADDITIONAL_CA_CERT_BUNDLE: ${ADDITIONAL_CA_CERT_BUNDLE:-leeg}"'
    - 'ls -l "$ADDITIONAL_CA_CERT_BUNDLE" 2>&1 | head -1'  
    - 'cat $ADDITIONAL_CA_CERT_BUNDLE'
    - echo "release $NEXT_VERSION"
  release:
    tag_name: $NEXT_VERSION
    name: 'Release $NEXT_VERSION'
    description: './RELEASE_NOTES.md'
